name: Release

on:
  repository_dispatch:
    types: [source-pushed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      publish: ${{ steps.read.outputs.publish }}
      sha: ${{ steps.read.outputs.sha }}
    steps:
      - name: Get the version from the source
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.SOURCE_REPO }}
          token: ${{ secrets.SOURCE_TOKEN }}
          ref: main
          sparse-checkout: src-tauri/tauri.conf.json
          sparse-checkout-cone-mode: false

      - name: Decide whether this version is new
        id: read
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(jq -r .version src-tauri/tauri.conf.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Version $version is already released, nothing to build."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Remove a leftover draft from a failed run
        if: steps.read.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases" --paginate             --jq ".[] | select(.draft and .tag_name == \"v${{ steps.read.outputs.version }}\") | .id" |
          while read -r id; do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
          done

  build:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: ""
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-22.04
            target: ""
    runs-on: ${{ matrix.os }}
    steps:
      - name: Get the source
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.SOURCE_REPO }}
          token: ${{ secrets.SOURCE_TOKEN }}
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libsecret-1-dev libdbus-1-dev pkg-config

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - run: pnpm install --frozen-lockfile

      - name: Get the release notes
        uses: actions/checkout@v4
        with:
          path: notes
          sparse-checkout: RELEASE_NOTES.md
          sparse-checkout-cone-mode: false

      - name: Read the release notes
        id: notes
        shell: bash
        run: |
          {
            echo "body<<NOTES_EOF"
            if [ -f notes/RELEASE_NOTES.md ]; then
              cat notes/RELEASE_NOTES.md
            else
              echo "Installers for Windows, macOS and Linux. JarvisQL updates itself from Help, Check for updates."
            fi
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: JarvisQL v__VERSION__
          releaseBody: ${{ steps.notes.outputs.body }}
          assetNamePattern: "[name]-[version]-[platform]-[arch][setup][ext]"
          releaseDraft: true
          prerelease: false
          # The build jobs run at the same time and would overwrite each other's latest.json,
          # so the publish job writes it once from every job's signatures.
          uploadUpdaterJson: false
          args: ${{ matrix.target && format('--target {0}', matrix.target) || '' }}

  publish:
    needs: [prepare, build]
    if: needs.prepare.outputs.publish == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Get the release notes
        uses: actions/checkout@v4
        with:
          sparse-checkout: RELEASE_NOTES.md
          sparse-checkout-cone-mode: false

      - name: Write latest.json from every platform's signature
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          tag="v$VERSION"
          mkdir sigs
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "*.sig" --dir sigs
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$tag"
          notes=$(cat RELEASE_NOTES.md 2>/dev/null || echo "")
          platforms='{}'
          add() {
            file="JarvisQL-$VERSION-$2"
            sig="sigs/$file.sig"
            if [ ! -f "$sig" ]; then echo "Missing $sig"; exit 1; fi
            platforms=$(jq --arg key "$1" --arg url "$base/$file" --rawfile sig "$sig" \
              '.[$key] = {signature: ($sig | rtrimstr("\n")), url: $url}' <<< "$platforms")
          }
          add windows-x86_64 windows-x64-setup.exe
          add windows-x86_64-nsis windows-x64-setup.exe
          add darwin-aarch64 darwin-aarch64.app.tar.gz
          add darwin-aarch64-app darwin-aarch64.app.tar.gz
          add darwin-x86_64 darwin-x64.app.tar.gz
          add darwin-x86_64-app darwin-x64.app.tar.gz
          add linux-x86_64 linux-amd64.AppImage
          add linux-x86_64-appimage linux-amd64.AppImage
          add linux-x86_64-deb linux-amd64.deb
          jq -n --arg version "$VERSION" --arg notes "$notes" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson platforms "$platforms" \
            '{version: $version, notes: $notes, pub_date: $date, platforms: $platforms}' > latest.json
          gh release upload "$tag" latest.json --repo "$GITHUB_REPOSITORY" --clobber

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq ".[] | select(.draft and .tag_name == \"v${{ needs.prepare.outputs.version }}\") | .id" | head -n 1)
          test -n "$id"
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$id" -F draft=false
